name: Strip EXIF

on:
  workflow_dispatch:
  push:
    paths:
      - "**.jpg"
      - "**.jpeg"
      - "**.png"
      - "**.webp"
      - ".pre-commit-config.yaml"
      - ".github/workflows/strip-exif.yml"
  pull_request:
    paths:
      - "**.jpg"
      - "**.jpeg"
      - "**.png"
      - "**.webp"
      - ".pre-commit-config.yaml"
      - ".github/workflows/strip-exif.yml"

permissions:
  contents: write

jobs:
  strip-exif:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Run strip-exif
        run: pre-commit run strip-exif --all-files || true

      - name: Commit stripped images
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet; then
            echo "No EXIF changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Strip EXIF metadata from images"
          git push

      - name: Fail PR when images need stripping
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            echo "No EXIF changes."
            exit 0
          fi
          git diff --name-only
          echo "Images contain metadata. Run pre-commit locally or merge after the branch workflow strips EXIF."
          exit 1
